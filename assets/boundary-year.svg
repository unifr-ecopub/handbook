<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">A boundary year, and an own-territory file</title>
  <desc id="d">Municipalities A and B exist in 2012. In 2018 they are one municipality, AB. A file at boundary year 2018 adds up the figures of A and B into one row for AB. An own-territory file keeps the row of A in 2012 under the number of AB and sets own_territory to 1.</desc>
  <rect x="1" y="1" width="758" height="398" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">List of 1 January 2012</text>
  <g stroke="#57606a" stroke-width="1.5">
    <path d="M40 60 L150 52 L172 96 L158 150 L60 156 L30 110 Z" fill="#dbe9ff"/>
    <path d="M172 96 L150 52 L262 58 L296 104 L268 152 L158 150 Z" fill="#ffe3c2"/>
  </g>
  <text x="96" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">A</text>
  <text x="96" y="124" font-size="12" text-anchor="middle" fill="#1f2328">number 101</text>
  <text x="224" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">B</text>
  <text x="224" y="124" font-size="12" text-anchor="middle" fill="#1f2328">number 102</text>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <line x1="318" y1="104" x2="424" y2="104"/>
    <path d="M416 97 L426 104 L416 111"/>
  </g>
  <text x="371" y="92" font-size="12" text-anchor="middle" fill="#57606a">A and B merge</text>

  <text x="452" y="34" font-size="15" font-weight="600" fill="#1f2328">List of 1 January 2018</text>
  <path d="M468 60 L578 52 L690 58 L724 104 L696 152 L586 150 L488 156 L458 110 Z" fill="#d9f2e0" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="590" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">AB</text>
  <text x="590" y="124" font-size="12" text-anchor="middle" fill="#1f2328">number 103</text>

  <text x="24" y="196" font-size="14" font-weight="600" fill="#1f2328">A file at boundary year 2018: figures of 2012 brought to the territory of 2018</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2328">
    <rect x="24" y="208" width="712" height="26" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="40" y="226" font-weight="700">gdenr_2018</text><text x="200" y="226" font-weight="700">year</text><text x="300" y="226" font-weight="700">population</text>
    <rect x="24" y="234" width="712" height="26" fill="#ffffff" stroke="#d0d7de"/>
    <text x="40" y="252">103</text><text x="200" y="252">2012</text><text x="300" y="252">5,000</text>
    <text x="440" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">3,000 of A and 2,000 of B, added up</text>
  </g>

  <text x="24" y="298" font-size="14" font-weight="600" fill="#1f2328">An own-territory file at 2018: the number is brought to 2018, the figures are not</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2328">
    <rect x="24" y="310" width="712" height="26" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="40" y="328" font-weight="700">gdenr_2018</text><text x="200" y="328" font-weight="700">year</text><text x="300" y="328" font-weight="700">tax_rate</text><text x="440" y="328" font-weight="700">own_territory</text>
    <rect x="24" y="336" width="712" height="26" fill="#fff4d6" stroke="#d0d7de"/>
    <text x="40" y="354">103</text><text x="200" y="354">2012</text><text x="300" y="354">1.10</text><text x="440" y="354">1</text>
    <text x="500" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">the rate of A alone, in 2012</text>
  </g>
  <text x="24" y="384" font-size="12" fill="#57606a">All names, numbers and figures in this picture are invented.</text>
</svg>
