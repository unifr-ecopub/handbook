# Publish the handbook as a website
#
# What it does: on every push to main, GitHub turns README.md, the pages in
# start/, researcher/, curator/, assistant/, data/, claude/ and reference/,
# and faq.md into a small website with Quarto and publishes it on GitHub
# Pages. README.md becomes the start page. The other pages follow in the
# order of its menu, in one part per folder, with a menu between them and a
# search box.
#
# A new page appears on the website only once it is added to the list of
# pages below. The run warns about a page that is missing from the list.
#
# Nothing else depends on it. No project, build or test of the platform uses
# this website, and nothing is installed on anyone's machine for it. If a run
# fails, the pages can still be read as Markdown on github.com, and the last
# website that was published stays online.
#
# Nothing it makes is kept in the repo. Everything Quarto needs (its project
# file, a copy of README.md named index.qmd, and copies of the pages and of
# assets/) is written at render time in the folder _build/, which exists only
# on GitHub's machine for the length of the run. The Markdown files in the
# repo are not changed: only their copies in _build/ are.
#
# Each page is copied with the ending .qmd instead of .md, because Quarto
# draws a diagram only in a .qmd file. The links between pages are changed to
# match in the copies.
#
# One setting on github.com, made once by an owner of the organisation:
# in this repo, Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until then the publishing step fails.

name: Publish the handbook

on:
  push:
    branches: [main]

# The least the run needs: read the repo, and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. The run that is publishing finishes: it is not
# cancelled. A run queued meanwhile waits, and a newer run queued after it
# replaces it: the waiting run is cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the repo
        uses: actions/checkout@v7

      # The Quarto version is fixed, so a new Quarto release cannot change
      # the website without someone choosing it.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # Plain lines for Bash with GNU sed (the "sed -i" below is GNU's form),
      # run at the top of the repo on GitHub's machine. To try them anywhere
      # else, run them in a copy of the repo made outside the clone: nothing
      # is to be rendered inside a clone.
      - name: Render the handbook
        shell: bash
        run: |
          # The pages, in the order of the start page's menu. A line
          # "part: <name>" opens a part of the website's menu, and the pages
          # after it belong to that part.
          pages='
          part: Start here
          start/set-up-your-machine.md
          start/first-day.md
          start/how-the-platform-fits-together.md
          part: Researcher
          researcher/daily-routine.md
          researcher/find-why-a-run-failed.md
          researcher/fix-a-rejected-push-or-a-conflict.md
          researcher/record-a-scientific-choice.md
          researcher/move-to-a-new-version.md
          researcher/use-a-table-made-by-hand.md
          researcher/work-with-r-steps.md
          researcher/review-code-and-paper.md
          researcher/start-or-get-a-project.md
          researcher/move-an-existing-project-in.md
          part: Curator
          curator/commit-and-push.md
          curator/add-a-delivery.md
          curator/save-a-table-made-by-hand.md
          curator/start-a-build.md
          curator/run-a-review-round.md
          curator/release-a-version.md
          curator/withdraw-a-version.md
          curator/add-the-yearly-register-list.md
          curator/assemble-a-replication-package.md
          curator/test-a-changed-chair-program.md
          curator/manage-repos-and-people.md
          part: Assistant
          assistant/fill-in-a-review-sheet.md
          assistant/look-over-a-candidate.md
          part: Reader of the shared data
          data/data-root.md
          data/data-map.md
          data/versions-and-pins.md
          data/municipal-data.md
          data/terms-of-use.md
          part: Working with Claude
          claude/working-with-claude.md
          part: Look something up
          reference/words.md
          reference/folders.md
          reference/messages-project-run.md
          reference/messages-build-and-release.md
          reference/never-do.md
          faq.md
          '

          # A fresh folder for everything the render makes.
          rm -rf _build
          mkdir -p _build

          # README.md is the start page; Quarto wants it named index.qmd.
          # Its first heading is dropped there, since the website's title
          # already stands at the top of that page.
          cp README.md _build/index.qmd
          sed -i '1{/^# /d}' _build/index.qmd

          # The pictures that the pages show.
          cp -r assets _build/assets

          # Quarto's project file. Each page takes its title from its first
          # heading. Section names get the same anchors as on github.com, so
          # a link such as work-with-r-steps.md#when-masterdo-says-r-is-not-ready
          # works on the site.
          cat > _build/_quarto.yml <<EOF
          project:
            type: book
            output-dir: _site
            resources:
              - "assets/**"
          format:
            html:
              from: markdown+gfm_auto_identifiers+autolink_bare_uris
              number-sections: false
              toc: true
              lang: en-GB
          book:
            title: "Handbook"
            chapters:
              - index.qmd
          EOF

          # Each page of the list is copied, as <page>.qmd, and added to the
          # menu, as far as it exists. A part is written only once one of its pages exists,
          # since Quarto refuses a part with no pages.
          part=""
          opened=""
          while read -r line; do
            case "$line" in
              "") continue ;;
              "part: "*) part="${line#part: }"; opened=""; continue ;;
            esac
            if [ ! -f "$line" ]; then
              echo "::warning::$line is in the list of pages but not in the repo"
              continue
            fi
            mkdir -p "_build/$(dirname "$line")"
            cp "$line" "_build/${line%.md}.qmd"
            if [ -z "$opened" ]; then
              printf '    - part: "%s"\n      chapters:\n' "$part" >> _build/_quarto.yml
              opened=yes
            fi
            printf '        - %s\n' "${line%.md}.qmd" >> _build/_quarto.yml
          done <<< "$pages"

          # A page in the repo that the list leaves out is not published.
          find . -name '*.md' -not -path './.*' -not -path './_build/*' \
              -not -path './tests/*' -not -name README.md -not -name CLAUDE.md \
            | sed 's#^\./##' | sort | while read -r page; do
            if ! printf '%s\n' "$pages" | sed 's/^ *//' | grep -qxF "$page"; then
              echo "::warning::$page is not in the list of pages, so it is not published"
            fi
          done

          # In every copied page: a link to README.md becomes a link to the
          # start page; a link to another page, <page>.md, becomes a link to
          # its copy, <page>.qmd (links to other websites are left alone);
          # and a diagram fenced as ```mermaid (the form that github.com
          # draws) becomes ```{mermaid} (the form Quarto draws).
          find _build -name '*.qmd' | while read -r page; do
            sed -i \
              -e 's#](\(\.\./\)*README\.md#](\1index.md#g' \
              -e 's#](\([^):]*\)\.md\([#)]\)#](\1.qmd\2#g' \
              -e 's/^\([[:space:]]*\)```mermaid[[:space:]]*$/\1```{mermaid}/' \
              "$page"
          done

          quarto render _build

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Hand the website to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/_site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
